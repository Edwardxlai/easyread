[project]
name = "easyread"
version = "1.4.6"
description = "EasyRead：把英文论文读成舒服的中文——后台翻译、对照原文、批注笔记、文献库"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["paper", "translation", "reader", "arxiv", "llm", "论文翻译"]
dependencies = [
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "pillow>=10",
  "pypdf>=4",
  "truststore>=0.10",
  "certifi>=2024.8.30",
]

[project.scripts]
easyread = "easyread.app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages.find = { include = ["easyread*"] }

[tool.setuptools.package-data]
easyread = ["library/check_tex.js", "web/*", "web/**/*"]
