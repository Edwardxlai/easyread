name: Build desktop releases

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: "Leave empty on main to build. On the release tag, enter the accepted build run ID to publish."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: inputs.candidate_run == '' && github.ref == 'refs/heads/main'
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04  # 用老系统打包：24.04 上打的 libpython 要新 glibc，22.04 及更老的机器打不开（AppImage 目录测试就挂在这）
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install backend build tools and dependencies
        run: python -m pip install --upgrade pip pyinstaller .
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check candidate version
        run: python -c "import json,tomllib,easyread; v=json.load(open('package.json'))['version']; assert v == easyread.__version__ == tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - name: Build and package
        run: npm run dist
        env:
          # macOS 包用固定的自签名证书签（scripts/mac_sign.cjs），应用内更新靠它认出是同一个程序
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
      - name: Smoke test the frozen backend
        run: python scripts/smoke_backend.py
      - name: Check glibc floor of the bundled libpython
        if: runner.os == 'Linux'
        shell: bash
        # 冒烟测试和打包在同一台机器上，查不出"打包机 glibc 比用户新"；1.2.5 就是这样在 22.04 上打不开
        run: |
          lib="$(python -c "import sysconfig, os; print(os.path.join(sysconfig.get_config_var('LIBDIR'), sysconfig.get_config_var('LDLIBRARY')))")"
          need="$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "$lib needs $need"
          [ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "::error::libpython needs $need, newer than Ubuntu 22.04"; exit 1; }
      - name: Record installer digests
        env:
          PLATFORM: ${{ matrix.name }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          python scripts/release_candidate.py record dist/electron --platform "$PLATFORM" --sha "$GITHUB_SHA" --version "$version"
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyread-${{ matrix.name }}
          # 只要安装包本身；dist/electron 里还有解包后的程序目录（Mac 的 .app 里有上百个文件）
          path: |
            dist/electron/candidate.json
            dist/electron/*.exe
            dist/electron/*.dmg
            dist/electron/*.zip
            dist/electron/*.AppImage
            dist/electron/*.blockmap
            dist/electron/latest*.yml
          if-no-files-found: error

  release:
    name: Publish the accepted candidate
    if: inputs.candidate_run != '' && startsWith(github.ref, 'refs/tags/v')
    concurrency: release-${{ github.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify selected build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          sha=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -e --arg sha "$sha" '
            .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch"
            and .path == ".github/workflows/release.yml" and .conclusion == "success"'
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft | grep -x true
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: easyread-*
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Verify package and updater digests
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/candidate-libs" PyYAML==6.0.2
          PYTHONPATH="$RUNNER_TEMP/candidate-libs" python3 scripts/release_candidate.py verify release-assets --sha "$(git rev-parse HEAD)" --version "${GITHUB_REF_NAME#v}"
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for asset in release-assets/easyread-*/*; do
            [[ "${asset##*/}" == candidate.json ]] || files+=("$asset")
          done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  invalid-input:
    if: (inputs.candidate_run == '' && github.ref != 'refs/heads/main') || (inputs.candidate_run != '' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Build on main, or promote a candidate run on its release tag.' >&2; exit 1
